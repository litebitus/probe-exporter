version: 2

before:
  hooks:
    - go run ./internal/schemaassets .schema-assets

builds:
  - id: probe-exporter
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

kos:
  - &release_image
    id: release-image
    disable: '{{ ne .Prerelease "" }}'
    build: probe-exporter
    repositories:
      - ghcr.io/litebitus/probe-exporter
      - quay.io/litebitus/probe-exporter
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
    annotations:
      org.opencontainers.image.source: https://github.com/litebitus/probe-exporter
    bare: true
    sbom: none
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
  - <<: *release_image
    id: snapshot-image
    disable: '{{ eq .Prerelease "" }}'
    labels:
      quay.expires-after: 2w

release:
  prerelease: auto
  extra_files:
    - glob: .schema-assets/*.schema.json
