name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - ".goreleaser.yml"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - ".goreleaser.yml"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test
