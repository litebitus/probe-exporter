name: Snapshot

on:
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  pre-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Compute the snapshot version
        id: version
        run: |
          set -euo pipefail
          version="$(svu patch)-snapshot.$(date -u +%Y%m%d%H%M%S)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${version}")" ]; then
            echo "tag $version already exists on origin" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Snapshot: $version"

      - name: Tag and push the snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Snapshot of commit ${GITHUB_SHA}." > "$RUNNER_TEMP/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Snapshot $VERSION"
          git push origin "$VERSION"

      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin

      - name: Build and publish the pre-release and its image
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize the snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Snapshot $VERSION"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for registry in ghcr.io quay.io; do
            image="${registry}/${GITHUB_REPOSITORY}:${VERSION#v}"
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "| \`$image\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
