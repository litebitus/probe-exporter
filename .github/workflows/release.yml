name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level: auto (from Conventional Commits, never across a major), patch, minor or major."
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: patch
      dry_run:
        description: "Compute and print the next version without changing anything."
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Compute the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) next="$(svu "$BUMP")" ;;
            auto)
              next="$(svu next)"
              if [ "${next%%.*}" != "$(svu current | cut -d. -f1)" ]; then
                next="$(svu minor)"
              fi
              ;;
          esac
          current="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '(none)')"
          if [ "$next" = "$current" ]; then
            echo "no version change ($next); nothing to release" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Current: $current -> Next: $next"

      - name: Check the release before changing anything
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/${NEXT}")" ]; then
            echo "tag $NEXT already exists on origin" >&2
            exit 1
          fi
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside && NF { found = 1 } END { exit !found }' CHANGELOG.md ||
            { echo "CHANGELOG.md has nothing under '## Unreleased' to release as $NEXT" >&2; exit 1; }

      - name: Stamp the changelogs, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          export RELEASE_DATE="$(date -u +%Y-%m-%d)"
          perl -pi -e 's/^## Unreleased$/$&\n\n## $ENV{NEXT} — $ENV{RELEASE_DATE}/i' CHANGELOG.md
          perl -pi -e 's/^## (\d+\.\d+) — unreleased$/## $1 — probe-exporter $ENV{NEXT}, $ENV{RELEASE_DATE}/i' schemas/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md schemas/CHANGELOG.md
          git commit -m "docs(changelog): ${NEXT}"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$NEXT"

      - name: Log in to the GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Quay
        if: ${{ !inputs.dry_run }}
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: echo "$QUAY_TOKEN" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin

      - name: Build and publish the release and its image
        if: ${{ !inputs.dry_run }}
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          {
            echo "### Release $VERSION"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for registry in ghcr.io quay.io; do
            image="${registry}/${GITHUB_REPOSITORY}:${VERSION}"
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "| \`$image\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN - would release ${{ steps.version.outputs.next }}"
